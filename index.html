<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Приветствие</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" id="form-card">
        <p class="label">Задача #6</p>
        <h1>Введите имя</h1>
        <p class="description">5 задачу сделай до конца, добавь туда бакэнд</p>
        <form id="greeting-form">
          <label for="name-input">Ваше имя</label>
          <div class="row">
            <input id="name-input" name="name" type="text" placeholder="Например, Раджан" autocomplete="name" required />
            <button type="submit">Показать</button>
          </div>
        </form>
      </section>

      <section class="card result hidden" id="result-card" aria-live="polite">
        <p class="label">Готово</p>
        <h2 id="greeting-title">Здравствуйте!</h2>
        <p class="description">Приятно видеть вас в этом маленьком браузерном приложении.</p>
        <button type="button" id="reset-button">Ввести другое имя</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
